server:
  port: 8084

spring:
  application:
    name: cloud-cart
  data:
    redis:
      host: ${REDIS_ADDR:${VM_HOST:localhost}}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:${VM_HOST:localhost}:9092}
    consumer:
      group-id: cart-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.cloudback.**"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:${VM_HOST:localhost}:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:${VM_HOST:localhost}:8848}
        file-extension: yml
        import-check.enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_ADDR:${VM_HOST:localhost}:8858}
      eager: true

knife4j:
  enable: ${KNIFE4J_ENABLE:false}

cloud:
  internal:
    token: ${CLOUD_INTERNAL_TOKEN:}
